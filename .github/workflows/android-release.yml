name: Build Android Release

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 1. Java 17 Kurulumu (Expo ve kararlı Gradle 8.x için en uyumlu sürüm)
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. Node.js Kurulumu
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Bağımlılıkların YARN ile Kurulması
      - name: Install Dependencies via Yarn
        run: |
          yarn config set network-timeout 300000
          yarn install --ignore-engines --non-interactive

      # 4. Expo CLI Kurulumu
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest

      # 5. Doğal Expo Prebuild Süreci
      - name: Expo Prebuild
        run: |
          npx expo prebuild --platform android --clean

      # 6. KRİTİK AYAR: Gradle Sürümünü Uyumlu 8.5 Sürümüne Çekme
      # Bu adım Gradle 9.x'in getirdiği breaking change'leri engeller
      - name: Downgrade Gradle to Stable 8.5
        run: |
          cd android
          ./gradlew wrapper --gradle-version 8.5 --distribution-type all

      # 7. Çalıştırma İzni Tanımlama
      - name: Make Gradle Wrapper Executable
        run: |
          if [ -d android ]; then
            chmod +x android/gradlew
          fi

      # 8. APK Derleme
      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      # 9. APK Dosyasını Summary (Artifacts) Ekranına Çıkarma
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk

      # 10. Otomatik Tag ve Sürüm Oluşturup APK'yı Yükleme
      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ github.sha }}
          name: "CsReader Otomatik Sürüm #${{ github.run_number }}"
          body: |
            Bu sürüm GitHub Actions tarafından otomatik olarak oluşturulmuştur.
            Commit Mesajı: ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false
          files: android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
