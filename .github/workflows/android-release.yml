name: Build Android Release

on:
  push:
    branches: [ "master", "main" ] # Repondaki branch adı 'master' olduğu için buraya master ekledik
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Java 21 Kurulumu
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 2. Node.js Kurulumu
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Bağımlılıkların Yüklenmesi
     # 3. Bağımlılıkların Yüklenmesi (Ağ hatalarına karşı network timeout ve retry eklendi)
      - name: Install Dependencies
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm install --legacy-peer-deps || npm ci

      # 4. Expo CLI Kurulumu
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest

      # 5. Olmayan Android Klasörünü Expo ile Otomatik Oluşturma (Prebuild)
      - name: Expo Prebuild (Generate Android Folder)
        run: npx expo prebuild --platform android

      # 6. Oluşan gradlew Dosyasına Çalıştırma Yetkisi Verme
      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      # 7. APK Derleme Aşaması
      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      # 8. Çıktı APK'sını GitHub Ortamına Yükleme
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk
