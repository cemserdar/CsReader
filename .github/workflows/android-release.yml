name: Build Android Release

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 1. Java 17 Kurulumu
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. Node.js Kurulumu
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Bağımlılıkların YARN ile Kurulması
      - name: Install Dependencies via Yarn
        run: |
          yarn config set network-timeout 300000
          yarn install --ignore-engines --non-interactive

      # 4. Expo ve EAS CLI Araçlarının Kurulması (Global olarak kurar ve sisteme tanıtır)
      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest

      # 5. DÜZELTİLEN ADIM: 'eas' komutunu doğrudan çalıştırma
      - name: Build Android App via EAS CLI
        run: |
          eas build --platform android --local --non-interactive

      # 6. Üretilen APK Çıktısını Yakalama
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ./*.apk

      # 7. Otomatik GitHub Sürümü (Release) Oluşturma ve Dosyayı Ekleme
      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ github.sha }}
          name: "CsReader Otomatik Sürüm #${{ github.run_number }}"
          body: |
            Bu sürüm Expo EAS Build altyapısı kullanılarak otomatik olarak üretilmiştir.
            Commit Mesajı: ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false
          files: ./*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
