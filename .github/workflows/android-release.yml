name: React Native Android CI/CD

on:
  release:
    types: [published] # Yeni bir GitHub Release yayınlandığında tetiklenir

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18' # Projenizin kullandığı Node sürümüne göre değiştirebilirsiniz
        cache: 'npm'       # yarn kullanıyorsanız 'yarn' yazın

    - name: Install Dependencies
      run: |
        npm install
        # Eğer yarn kullanıyorsanız sadece 'yarn install' yazın

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradlew
      run: chmod +x android/gradlew

    - name: Build Release APK
      run: |
        cd android
        ./gradlew assembleRelease --no-daemon

    - name: Upload APK to Release Assets
      uses: softprops/action-gh-release@v2
      with:
        files: android/app/build/outputs/apk/release/app-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
