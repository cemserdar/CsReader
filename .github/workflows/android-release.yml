name: Build Android Release

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Java 17 Kurulumu (Hata veren cache parametresi tamamen kaldırıldı)
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. Node.js Kurulumu (Hata riski taşımaması için cache parametresi tamamen kaldırıldı)
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Bağımlılıkların Temiz Kurulumu
      - name: Install Dependencies
        run: |
          npm config set fetch-retries 5
          npm install --legacy-peer-deps

      # 4. Expo CLI Kurulumu
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest

      # 5. Expo Prebuild (Android klasörü üretimi)
      - name: Expo Prebuild
        run: npx expo prebuild --platform android

      # 6. Gradle Sürümünü En Kararlı Expo Yapısına Çekme (8.0.2)
      - name: Downgrade Gradle Version for Expo Compatibility
        run: |
          cd android
          ./gradlew wrapper --gradle-version 8.0.2 --distribution-type all

      # 7. Çalıştırma İzni Tanımlama
      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      # 8. APK Derleme
      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      # 9. APK Dosyasını Summary Ekranına Çıkarma
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk
