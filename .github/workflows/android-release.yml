name: Build Android Release

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Java 11 Kurulumu (Eski kararlı Expo/Gradle şablonları için Java 11 en güvenlisidir)
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      # 2. Node.js Kurulumu
      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 3. Bağımlılıkların YARN ile Kurulması (Ağ hatalarına karşı npm yerine çok daha kararlıdır)
      - name: Install Dependencies via Yarn
        run: |
          yarn config set network-timeout 300000
          yarn install --frozen-lockfile || yarn install --non-interactive

      # 4. Expo CLI Kurulumu
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest

      # 5. KRİTİK DEĞİŞİKLİK: Eski ve Kararlı Gradle/AGP Şablonu ile Android Klasörü Oluşturma
      # Bu sayede ':expo' ve ':expo-localization' kütüphaneleri 'release not found' hatası vermez.
      - name: Expo Prebuild with Stable Template
        run: npx expo prebuild --platform android --template expo-template-blank

      # 6. Çalıştırma İzni Tanımlama
      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      # 7. APK Derleme
      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      # 8. APK Dosyasını Summary Ekranına Çıkarma
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk
