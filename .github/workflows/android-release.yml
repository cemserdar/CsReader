name: Build Android Release

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Java 17 Kurulumu (Expo şablonu ve AGP uyumu için Java 17 idealdir)
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. Node.js Kurulumu (Hata veren 18 sürümü yerine en az v20.12.0 isteyen paketi tatmin etmek için v20 yapıldı)
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Bağımlılıkların YARN ile Kurulması (Hem network timeout eklendi hem de engine kontrolü esnetildi)
      - name: Install Dependencies via Yarn
        run: |
          yarn config set network-timeout 300000
          yarn install --ignore-engines --non-interactive

      # 4. Expo CLI Kurulumu
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest

      # 5. Stabil Android Klasörü Üretimi
      - name: Expo Prebuild
        run: npx expo prebuild --platform android --template expo-template-blank

      # 6. Çalıştırma İzni Tanımlama
      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      # 7. APK Derleme
      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      # 8. APK Dosyasını Summary Ekranına Çıkarma
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk
