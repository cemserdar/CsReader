name: React Native Android CI/CD

on:
  release:
    types: [published] # Yeni bir GitHub Release yayınlandığında tetiklenir

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18' # Projenizin kullandığı Node sürümüne göre değiştirebilirsiniz
        cache: 'npm'       # yarn kullanıyorsanız 'yarn' yazın

    - name: Install Dependencies
      run: |
        npm install
        # Eğer yarn kullanıyorsanız sadece 'yarn install' yazın

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4

    - name: Write local.properties with SDK path
      run: |
        echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

    - name: Grant Execute Permission for Gradlew
      run: |
        if [ -f "android/gradlew" ]; then
          chmod +x android/gradlew
        elif [ -f "gradlew" ]; then
          chmod +x gradlew
        else
          echo "gradlew bulunamadı, mevcut dizin kontrol ediliyor:"
          ls -la
          find . -name "gradlew"
        fi

    - name: Build Release APK
      run: |
        if [ -d "android" ]; then
          cd android
          ./gradlew assembleRelease --no-daemon
        else
          ./gradlew assembleRelease --no-daemon
        fi

    - name: Upload APK to Release Assets
      uses: softprops/action-gh-release@v2
      with:
        files: android/app/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
