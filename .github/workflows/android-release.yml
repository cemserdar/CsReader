name: Build Android Release

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Java 17 Kurulumu
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. Node.js Kurulumu
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Bağımlılıkların Yüklenmesi
      - name: Install Dependencies
        run: |
          npm config set fetch-retries 5
          npm install --legacy-peer-deps

      # 4. Expo ve EAS CLI Kurulumu
      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }} # İsteğe bağlı: Eğer EAS bulutunu kullansaydın gerekecekti, lokalde boş kalabilir ama kalsın.

      # 5. EAS ile Kurulabilir Android Klasörünü ve Gradle Ayarlarını Otomatik Optimize Etme
      - name: Build APK Local via EAS
        run: npx eas build --platform android --local --profile preview --non-interactive

      # 6. Üretilen APK'yı Yakala ve Yükle
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ./*.apk # EAS local build, APK'yı genellikle projenin kök dizinine bırakır
