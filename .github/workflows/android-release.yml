name: Build Android Release

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Java 17 Kurulumu (Gradle 9.3.1'in çalışabilmesi için ŞART)
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. Node.js Kurulumu
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Bağımlılıkların YARN ile Kurulması (Node motor kısıtlamaları bypass ediliyor)
      - name: Install Dependencies via Yarn
        run: |
          yarn config set network-timeout 300000
          yarn install --ignore-engines --non-interactive

      # 4. Expo CLI Kurulumu
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest

      # 5. Doğal Expo Prebuild Süreci (Bırakalım projenin orijinal güncel şablonu üretilsin)
      - name: Expo Prebuild
        run: |
          npx expo prebuild --platform android --clean

      # 6. Çalıştırma İzni Tanımlama
      - name: Make Gradle Wrapper Executable
        run: |
          if [ -d android ]; then
            chmod +x android/gradlew
          fi

      # 7. APK Derleme (Java 17 sayesinde Gradle 9.3.1 artık hata vermeden derleyecek)
      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      # 8. APK Dosyasını Summary Ekranına Çıkarma
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk
