name: Build Android Release

on:
  push:
    branches: [ "main" ] # ya da projenin ana branch adı neyse (master, main vb.)
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Bu satır, GitHub panelinden el ile (manuel) tetikleme butonu ekler
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

      - name: Generate Android Wrapper if Missing
        run: |
          cd android
          if [ ! -f gradlew ]; then
            echo "Gradlew bulunamadı, oluşturuluyor..."
            gradle wrapper
          else
            echo "Gradle wrapper zaten mevcut."
          fi

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk
