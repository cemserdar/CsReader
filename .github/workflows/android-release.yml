name: Build Android Release

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Java 21 Kurulumu
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 2. Node.js Kurulumu
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Bağımlılıkların Yüklenmesi (Ağ hatalarına karşı dayanıklı yapı)
      - name: Install Dependencies
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm ci || npm install --legacy-peer-deps

      # 4. Expo CLI Kurulumu
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest

      # 5. Expo Prebuild (Android Klasörünü oluşturma)
      - name: Expo Prebuild
        run: npx expo prebuild --platform android

      # 6. KRİTİK ADIM: Gradle Sürümünü Expo ile Uyumlu Olan 8.8 Sürümüne Çekme
      - name: Downgrade Gradle Version for Expo Compatibility
        run: |
          cd android
          ./gradlew wrapper --gradle-version 8.8 --distribution-type all

      # 7. Oluşan gradlew Dosyasına Çalıştırma Yetkisi Verme
      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      # 8. APK Derleme Aşaması
      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      # 9. Çıktı APK'sını GitHub Ortamına Yükleme
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk
