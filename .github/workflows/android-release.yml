jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 1. Adım: Eğer gradlew dosyası varsa Linux üzerinde çalıştırılabilir (executable) izni veriyoruz.
      # Bu adım, ilerleyen aşamalarda "Permission Denied" (Erişim Engellendi) hatası almanı önler.
      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

      # 2. Adım: Wrapper eksikse android klasörünün içine girip oluşturuyoruz.
      - name: Generate Android Wrapper if Missing
        run: |
          cd android
          if [ ! -f gradlew ]; then
            echo "Gradlew bulunamadı, oluşturuluyor..."
            gradle wrapper
          else
            echo "Gradle wrapper zaten mevcut."
          fi

      # 3. Adım: Android klasörüne girip derleme işlemini başlatıyoruz.
      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease

      # 4. Adım: Üretilen APK dosyasını GitHub Actions paneline yüklüyoruz.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk
