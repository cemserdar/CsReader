<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CsReader EPUB Viewer</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #faf8f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #viewer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: transparent;
      /* Default: visible, no transform */
      opacity: 1;
      transform: translateX(0);
    }

    .epubjs-hl       { fill-opacity: 0.3; mix-blend-mode: multiply; cursor: pointer; }
    .epubjs-hl-yellow  { fill: #fef08a; background-color: rgba(254,240,138,0.4); }
    .epubjs-hl-green   { fill: #bbf7d0; background-color: rgba(187,247,208,0.4); }
    .epubjs-hl-pink    { fill: #fbcfe8; background-color: rgba(251,207,232,0.4); }
    .epubjs-hl-blue    { fill: #bfdbfe; background-color: rgba(191,219,254,0.4); }
    .epubjs-hl-underline { fill: transparent; border-bottom: 2px dashed #ef4444; }
  </style>
  <script src="epub.min.js"></script>
</head>

<body>
  <div id="viewer"></div>

  <script>
    // ── State ──────────────────────────────────────────────────────────────────
    let book        = null;
    let rendition   = null;
    let currentCfi  = "";
    let currentTheme = "light";
    let currentTransition = "slide";

    // Single nav-lock: true while an animation + epub.js navigation is in flight
    let navBusy = false;
    let navBusyTimer = null;

    let highlights  = {};

    const viewer = document.getElementById('viewer');

    // ── Bridge ─────────────────────────────────────────────────────────────────
    // Use AndroidBridge directly (injected by Kotlin via addJavascriptInterface).
    // Fallback to window.ReactNativeWebView shim for compatibility.
    function sendToAndroid(type, payload) {
      const msg = JSON.stringify({ type, ...payload });
      try {
        if (typeof AndroidBridge !== 'undefined') {
          AndroidBridge.postMessage(msg);
        } else if (window.ReactNativeWebView) {
          window.ReactNativeWebView.postMessage(msg);
        }
      } catch(e) {
        console.error('Bridge error:', e);
      }
    }

    // ── Commands from Android ──────────────────────────────────────────────────
    // Android calls this function directly via evaluateJavascript
    function handleCommand(json) {
      let msg;
      try { msg = JSON.parse(json); } catch(e) { return; }

      switch (msg.action) {
        case 'load':
          loadBook(msg.bookPath, msg.initialCfi, msg.theme, msg.fontSize, msg.pageTransition, msg.highlights || []);
          break;
        case 'next':       doNext(); break;
        case 'prev':       doPrev(); break;
        case 'goToCfi':
          if (rendition) rendition.display(msg.cfi);
          break;
        case 'setTheme':
          applyTheme(msg.theme);
          break;
        case 'setFontSize':
          if (rendition) rendition.themes.fontSize(msg.fontSize + 'px');
          break;
        case 'setTransition':
          currentTransition = msg.pageTransition || 'slide';
          break;
        case 'addHighlight':
          addHighlight(msg.cfiRange, msg.color, true);
          break;
        case 'removeHighlight':
          removeHighlight(msg.cfiRange);
          break;
      }
    }

    // Also keep the postMessage listener as secondary fallback
    window.addEventListener('message', function(event) {
      let msg;
      try {
        msg = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
      } catch(e) { return; }
      handleCommand(JSON.stringify(msg));
    });

    // ── Nav lock helpers ───────────────────────────────────────────────────────
    function lockNav(ms) {
      navBusy = true;
      clearTimeout(navBusyTimer);
      navBusyTimer = setTimeout(() => { navBusy = false; }, ms);
    }

    function unlockNav() {
      navBusy = false;
      clearTimeout(navBusyTimer);
    }

    // ── Viewer animation ───────────────────────────────────────────────────────
    function viewerSlideOut(direction) {
      // direction: 'next' slides left-out, 'prev' slides right-out
      return new Promise(resolve => {
        viewer.style.transition = 'transform 0.22s ease-out, opacity 0.22s ease-out';
        viewer.style.transform  = direction === 'next' ? 'translateX(-30%)' : 'translateX(30%)';
        viewer.style.opacity    = '0';
        setTimeout(resolve, 230);
      });
    }

    function viewerSlideIn(direction) {
      // position off-screen first (no transition), then animate in
      viewer.style.transition = 'none';
      viewer.style.transform  = direction === 'next' ? 'translateX(30%)' : 'translateX(-30%)';
      viewer.style.opacity    = '0';
      // force reflow
      void viewer.offsetWidth;
      viewer.style.transition = 'transform 0.22s ease-out, opacity 0.22s ease-out';
      viewer.style.transform  = 'translateX(0)';
      viewer.style.opacity    = '1';
    }

    function viewerFadeOut() {
      return new Promise(resolve => {
        viewer.style.transition = 'opacity 0.18s ease';
        viewer.style.opacity    = '0';
        setTimeout(resolve, 190);
      });
    }

    function viewerFadeIn() {
      viewer.style.transition = 'opacity 0.22s ease';
      viewer.style.opacity    = '1';
    }

    function viewerReset() {
      viewer.style.transition = 'none';
      viewer.style.transform  = 'translateX(0)';
      viewer.style.opacity    = '1';
    }

    // ── Navigation ─────────────────────────────────────────────────────────────
    async function doNext() {
      if (navBusy || !rendition) return;
      lockNav(900);

      if (currentTransition === 'slide') {
        await viewerSlideOut('next');
        await rendition.next();
        viewerSlideIn('next');
      } else if (currentTransition === 'fade') {
        await viewerFadeOut();
        await rendition.next();
        viewerFadeIn();
      } else {
        await rendition.next();
      }
    }

    async function doPrev() {
      if (navBusy || !rendition) return;
      lockNav(900);

      if (currentTransition === 'slide') {
        await viewerSlideOut('prev');
        await rendition.prev();
        viewerSlideIn('prev');
      } else if (currentTransition === 'fade') {
        await viewerFadeOut();
        await rendition.prev();
        viewerFadeIn();
      } else {
        await rendition.prev();
      }
    }

    // ── Load Book ──────────────────────────────────────────────────────────────
    function loadBook(bookPath, initialCfi, theme, fontSize, pageTransition, savedHighlights) {
      currentTransition = pageTransition || 'slide';
      viewerReset();

      if (book) {
        try { book.destroy(); } catch(e) {}
      }

      book = ePub(bookPath);

      book.opened.catch(err => {
        sendToAndroid('error', { message: 'Kitap açılamadı: ' + err.message });
      });

      book.loaded.navigation.then(function(toc) {
        const chapters = toc.map(ch => ({
          label: (ch.label || '').trim(),
          href:  ch.href
        }));
        sendToAndroid('toc', { chapters });
      }).catch(() => {});

      book.loaded.metadata.then(function(meta) {
        sendToAndroid('metadata', {
          title:   meta.title,
          creator: meta.creator
        });
      }).catch(() => {});

      rendition = book.renderTo('viewer', {
        width:   '100%',
        height:  '100%',
        spread:  'none',
        minSpreadWidth: 9999, // force single column always
        flow:    'paginated',
        manager: 'default'
      });

      applyTheme(theme || 'light');
      rendition.themes.fontSize((fontSize || 16) + 'px');

      // Display initial location
      rendition.display(initialCfi || undefined).catch(err => {
        console.error('display error:', err);
        rendition.display();
      });

      // ── relocated: always reset viewer visibility ─────────────────────────
      rendition.on('relocated', function(location) {
        // Always ensure viewer is visible after navigation
        viewerReset();
        unlockNav();

        currentCfi = location.start.cfi;
        let progress = 0;
        try {
          progress = book.locations.percentageFromCfi(currentCfi) || 0;
        } catch(e) {}

        sendToAndroid('relocated', {
          cfi:      currentCfi,
          progress: progress,
          atStart:  location.atStart,
          atEnd:    location.atEnd
        });
      });

      rendition.on('selected', function(cfiRange, contents) {
        const sel  = contents.window.getSelection();
        const text = sel ? sel.toString().trim() : '';
        if (text.length > 0) {
          sendToAndroid('selected', { cfiRange, text });
        }
      });

      rendition.on('click', function() {
        sendToAndroid('click', {});
      });

      // Swipe gestures (separate touch tracking per rendered view)
      rendition.on('rendered', function(section, view) {
        setupSwipe(view.contents);
        // Re-apply highlights for this section
        savedHighlights.forEach(hl => {
          addHighlight(hl.cfiRange, hl.color, false);
        });
      });

      // Generate locations for progress (background, non-blocking)
      book.ready.then(() => {
        book.locations.generate(1024).then(() => {
          if (currentCfi) {
            try {
              const p = book.locations.percentageFromCfi(currentCfi) || 0;
              sendToAndroid('progressReady', { progress: p });
            } catch(e) {}
          }
        });
      }).catch(() => {});
    }

    // ── Theme ──────────────────────────────────────────────────────────────────
    function applyTheme(theme) {
      currentTheme = theme;
      const themes = {
        light:  { bg: '#faf8f5', color: '#1c1917', link: '#2563eb' },
        dark:   { bg: '#121212', color: '#e5e5e5', link: '#60a5fa' },
        sepia:  { bg: '#f4ecd8', color: '#5c4033', link: '#92400e' },
        forest: { bg: '#eef1eb', color: '#2d3a24', link: '#166534' }
      };
      const t = themes[theme] || themes.light;
      document.body.style.backgroundColor = t.bg;

      if (rendition) {
        rendition.themes.default({
          body:  { 'background-color': t.bg + ' !important', 'color': t.color + ' !important',
                   'font-family': 'system-ui,-apple-system,sans-serif !important', 'line-height': '1.7 !important' },
          p:     { 'color': t.color + ' !important' },
          span:  { 'color': t.color + ' !important' },
          a:     { 'color': t.link + ' !important' }
        });
      }
    }

    // ── Highlights ─────────────────────────────────────────────────────────────
    function addHighlight(cfiRange, color, save) {
      if (!rendition || !cfiRange) return;
      const classMap = { yellow: 'epubjs-hl-yellow', green: 'epubjs-hl-green',
                         pink: 'epubjs-hl-pink', blue: 'epubjs-hl-blue', underline: 'epubjs-hl-underline' };
      const cls = classMap[color] || 'epubjs-hl-yellow';
      try {
        rendition.annotations.add('highlight', cfiRange, {}, () => {
          sendToAndroid('highlightClicked', { cfiRange });
        }, cls);
        highlights[cfiRange] = color;
      } catch(e) {}
    }

    function removeHighlight(cfiRange) {
      if (!rendition || !cfiRange) return;
      try {
        rendition.annotations.remove(cfiRange, 'highlight');
        delete highlights[cfiRange];
      } catch(e) {}
    }

    // ── Swipe Gestures ─────────────────────────────────────────────────────────
    function setupSwipe(contents) {
      let startX = 0, startY = 0;
      let startTime = 0;

      contents.on('touchstart', (e) => {
        startX    = e.changedTouches[0].clientX;
        startY    = e.changedTouches[0].clientY;
        startTime = Date.now();
      });

      contents.on('touchend', (e) => {
        if (navBusy) return;  // ignore swipes while nav is in progress
        const dx = e.changedTouches[0].clientX - startX;
        const dy = e.changedTouches[0].clientY - startY;
        const dt = Date.now() - startTime;

        // Only horizontal swipes (not vertical scrolls), fast enough, far enough
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5 && dt < 400) {
          if (dx > 0) doPrev();
          else        doNext();
        }
      });
    }
  </script>
</body>

</html>
