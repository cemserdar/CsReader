<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CsReader EPUB Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #faf8f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #viewer-container {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #viewer {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      opacity: 1;
      transform: translateX(0);
      will-change: transform, opacity;
    }

    /* epub.js iframe must fill the viewer */
    #viewer iframe {
      border: none !important;
      width: 100% !important;
      height: 100% !important;
      display: block !important;
    }

    #error-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      color: #fff;
      z-index: 9999;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 32px;
      text-align: center;
    }
    #error-overlay.show { display: flex; }
    #error-title { font-size: 18px; font-weight: bold; margin-bottom: 12px; }
    #error-msg { font-size: 13px; opacity: 0.8; line-height: 1.6; }

    .epubjs-hl       { fill-opacity: 0.3; mix-blend-mode: multiply; cursor: pointer; }
    .epubjs-hl-yellow  { fill: #fef08a; background-color: rgba(254,240,138,0.4); }
    .epubjs-hl-green   { fill: #bbf7d0; background-color: rgba(187,247,208,0.4); }
    .epubjs-hl-pink    { fill: #fbcfe8; background-color: rgba(251,207,232,0.4); }
    .epubjs-hl-blue    { fill: #bfdbfe; background-color: rgba(191,219,254,0.4); }
    .epubjs-hl-underline { fill: transparent; border-bottom: 2px dashed #ef4444; }
  </style>
  <script src="epub.min.js"></script>
</head>

<body>
  <div id="viewer-container">
    <div id="viewer"></div>
  </div>
  <div id="error-overlay">
    <div id="error-title">⚠️ Kitap Açılamadı</div>
    <div id="error-msg"></div>
  </div>

  <script>
    // ── Global error handler ────────────────────────────────────────────────────
    window.addEventListener('error', function(e) {
      sendToAndroid('error', { message: 'JS Hata: ' + e.message });
    });

    // ── State ──────────────────────────────────────────────────────────────────
    let book        = null;
    let rendition   = null;
    let currentCfi  = '';
    let currentTheme = 'light';
    let currentTransition = 'slide';

    let navBusy = false;
    let navBusyTimer = null;

    let highlights  = {};

    const viewer    = document.getElementById('viewer');
    const errOverlay = document.getElementById('error-overlay');
    const errMsg    = document.getElementById('error-msg');

    // ── Bridge ─────────────────────────────────────────────────────────────────
    function sendToAndroid(type, payload) {
      const msg = JSON.stringify({ type, ...payload });
      try {
        if (typeof AndroidBridge !== 'undefined') {
          AndroidBridge.postMessage(msg);
        } else if (window.ReactNativeWebView) {
          window.ReactNativeWebView.postMessage(msg);
        }
      } catch(e) {}
    }

    function showError(title, detail) {
      errOverlay.classList.add('show');
      document.getElementById('error-title').textContent = '⚠️ ' + title;
      errMsg.textContent = detail || '';
      sendToAndroid('error', { message: title + ' ' + (detail || '') });
    }

    // ── Commands from Android ──────────────────────────────────────────────────
    function handleCommand(json) {
      let msg;
      try { msg = JSON.parse(json); } catch(e) { return; }

      switch (msg.action) {
        case 'load':
          loadBook(msg.bookPath, msg.initialCfi, msg.theme, msg.fontSize, msg.pageTransition, msg.highlights || []);
          break;
        case 'next':        doNext(); break;
        case 'prev':        doPrev(); break;
        case 'goToCfi':
          if (rendition) rendition.display(msg.cfi).catch(() => {});
          break;
        case 'setTheme':
          applyTheme(msg.theme);
          break;
        case 'setFontSize':
          if (rendition) rendition.themes.fontSize(msg.fontSize + 'px');
          break;
        case 'setTransition':
          currentTransition = msg.pageTransition || 'slide';
          break;
        case 'addHighlight':
          addHighlight(msg.cfiRange, msg.color, true);
          break;
        case 'removeHighlight':
          removeHighlight(msg.cfiRange);
          break;
      }
    }

    window.addEventListener('message', function(event) {
      let msg;
      try {
        msg = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
      } catch(e) { return; }
      handleCommand(JSON.stringify(msg));
    });

    // ── Nav lock helpers ───────────────────────────────────────────────────────
    function lockNav(ms) {
      navBusy = true;
      clearTimeout(navBusyTimer);
      navBusyTimer = setTimeout(() => { navBusy = false; }, ms);
    }

    function unlockNav() {
      navBusy = false;
      clearTimeout(navBusyTimer);
    }

    // ── Viewer animation ───────────────────────────────────────────────────────
    // "next" = current page slides LEFT, new page enters from RIGHT
    // "prev" = current page slides RIGHT, new page enters from LEFT
    function animateOut(direction) {
      return new Promise(resolve => {
        viewer.style.transition = 'transform 0.25s ease-in-out, opacity 0.25s ease-in-out';
        viewer.style.transform  = direction === 'next' ? 'translateX(-100%)' : 'translateX(100%)';
        viewer.style.opacity    = '0';
        setTimeout(resolve, 260);
      });
    }

    function animateIn(direction) {
      // Start off-screen on the OPPOSITE side
      viewer.style.transition = 'none';
      viewer.style.transform  = direction === 'next' ? 'translateX(100%)' : 'translateX(-100%)';
      viewer.style.opacity    = '0';
      void viewer.offsetWidth; // force reflow
      viewer.style.transition = 'transform 0.25s ease-in-out, opacity 0.25s ease-in-out';
      viewer.style.transform  = 'translateX(0)';
      viewer.style.opacity    = '1';
    }

    function fadeOut() {
      return new Promise(resolve => {
        viewer.style.transition = 'opacity 0.2s ease';
        viewer.style.opacity    = '0';
        setTimeout(resolve, 210);
      });
    }

    function fadeIn() {
      viewer.style.transition = 'opacity 0.25s ease';
      viewer.style.opacity    = '1';
    }

    function resetViewer() {
      viewer.style.transition = 'none';
      viewer.style.transform  = 'translateX(0)';
      viewer.style.opacity    = '1';
    }

    // ── Navigation ─────────────────────────────────────────────────────────────
    async function doNext() {
      if (navBusy || !rendition) return;
      lockNav(800);

      if (currentTransition === 'slide') {
        await animateOut('next');
        await rendition.next();
        animateIn('next');
      } else if (currentTransition === 'fade') {
        await fadeOut();
        await rendition.next();
        fadeIn();
      } else {
        await rendition.next();
      }
    }

    async function doPrev() {
      if (navBusy || !rendition) return;
      lockNav(800);

      if (currentTransition === 'slide') {
        await animateOut('prev');
        await rendition.prev();
        animateIn('prev');
      } else if (currentTransition === 'fade') {
        await fadeOut();
        await rendition.prev();
        fadeIn();
      } else {
        await rendition.prev();
      }
    }

    // ── Load Book ──────────────────────────────────────────────────────────────
    function loadBook(bookPath, initialCfi, theme, fontSize, pageTransition, savedHighlights) {
      currentTransition = pageTransition || 'slide';
      resetViewer();
      errOverlay.classList.remove('show');

      if (book) {
        try { book.destroy(); } catch(e) {}
        book = null;
        rendition = null;
      }

      // Create ePub book instance
      book = ePub(bookPath);

      book.opened.then(function() {
        // Book opened successfully, proceed with rendering
      }).catch(function(err) {
        showError('Kitap açılamadı', err ? err.message : '');
      });

      book.loaded.navigation.then(function(toc) {
        const chapters = toc.map(ch => ({
          label: (ch.label || '').trim(),
          href:  ch.href
        }));
        sendToAndroid('toc', { chapters });
      }).catch(() => {});

      book.loaded.metadata.then(function(meta) {
        sendToAndroid('metadata', {
          title:   meta.title,
          creator: meta.creator
        });
      }).catch(() => {});

      // Create rendition — NO allowScriptedContent (causes issues in some versions)
      rendition = book.renderTo('viewer', {
        width:   '100%',
        height:  '100%',
        spread:  'none',
        flow:    'paginated',
        manager: 'default'
      });

      // Apply theme and font size
      applyTheme(theme || 'light');
      rendition.themes.fontSize((fontSize || 16) + 'px');

      // Hook: set up swipe gestures and click detection inside the epub iframe
      rendition.on('rendered', function(section, view) {
        try {
          const doc = view.document || (view.contents && view.contents.document);
          if (doc) {
            setupSwipe(doc);
            setupClick(doc);
          }
        } catch(e) {}

        // Re-apply saved highlights for this section
        savedHighlights.forEach(hl => {
          addHighlight(hl.cfiRange, hl.color, false);
        });
      });

      // Also attach swipe/click via contents hook as backup
      rendition.on('displayed', function(section) {
        try {
          const view = rendition.manager && rendition.manager.current();
          if (view && view.document) {
            setupSwipe(view.document);
            setupClick(view.document);
          }
        } catch(e) {}
      });

      // selected text → highlight dialog
      rendition.on('selected', function(cfiRange, contents) {
        try {
          const sel  = contents.window.getSelection();
          const text = sel ? sel.toString().trim() : '';
          if (text.length > 0) {
            sendToAndroid('selected', { cfiRange, text });
          }
        } catch(e) {}
      });

      // relocated → send progress back to Android
      rendition.on('relocated', function(location) {
        resetViewer();
        unlockNav();

        currentCfi = location.start.cfi;
        let progress = 0;
        try {
          progress = book.locations.percentageFromCfi(currentCfi) || 0;
        } catch(e) {}

        sendToAndroid('relocated', {
          cfi:      currentCfi,
          progress: progress,
          atStart:  location.atStart,
          atEnd:    location.atEnd
        });
      });

      // Display initial location
      const displayTarget = (initialCfi && initialCfi !== '') ? initialCfi : undefined;
      rendition.display(displayTarget).catch(function(err) {
        // Retry without CFI on error
        rendition.display().catch(function(err2) {
          showError('Sayfa görüntülenemedi', err2 ? err2.message : '');
        });
      });

      // Generate locations for progress tracking (background, non-blocking)
      book.ready.then(() => {
        book.locations.generate(1024).then(() => {
          if (currentCfi) {
            try {
              const p = book.locations.percentageFromCfi(currentCfi) || 0;
              sendToAndroid('progressReady', { progress: p });
            } catch(e) {}
          }
        }).catch(() => {});
      }).catch(() => {});
    }

    // ── Theme ──────────────────────────────────────────────────────────────────
    function applyTheme(theme) {
      currentTheme = theme;
      const themes = {
        light:  { bg: '#faf8f5', color: '#1c1917', link: '#2563eb' },
        dark:   { bg: '#121212', color: '#e5e5e5', link: '#60a5fa' },
        sepia:  { bg: '#f4ecd8', color: '#5c4033', link: '#92400e' },
        forest: { bg: '#eef1eb', color: '#2d3a24', link: '#166534' }
      };
      const t = themes[theme] || themes.light;
      document.body.style.backgroundColor = t.bg;
      document.getElementById('viewer-container').style.backgroundColor = t.bg;

      if (rendition) {
        rendition.themes.default({
          body:  { 'background-color': t.bg + ' !important', 'color': t.color + ' !important',
                   'font-family': 'system-ui,-apple-system,sans-serif !important', 'line-height': '1.7 !important' },
          p:     { 'color': t.color + ' !important' },
          span:  { 'color': t.color + ' !important' },
          a:     { 'color': t.link + ' !important' }
        });
      }
    }

    // ── Highlights ─────────────────────────────────────────────────────────────
    function addHighlight(cfiRange, color, save) {
      if (!rendition || !cfiRange) return;
      const classMap = { yellow: 'epubjs-hl-yellow', green: 'epubjs-hl-green',
                         pink: 'epubjs-hl-pink', blue: 'epubjs-hl-blue', underline: 'epubjs-hl-underline' };
      const cls = classMap[color] || 'epubjs-hl-yellow';
      try {
        rendition.annotations.add('highlight', cfiRange, {}, () => {
          sendToAndroid('highlightClicked', { cfiRange });
        }, cls);
        highlights[cfiRange] = color;
      } catch(e) {}
    }

    function removeHighlight(cfiRange) {
      if (!rendition || !cfiRange) return;
      try {
        rendition.annotations.remove(cfiRange, 'highlight');
        delete highlights[cfiRange];
      } catch(e) {}
    }

    // ── Click detection (full-screen toggle) ───────────────────────────────────
    function setupClick(doc) {
      try {
        // Remove existing listener to avoid duplicates
        doc.removeEventListener('click', onDocClick, true);
        doc.addEventListener('click', onDocClick, true);
      } catch(e) {}
    }

    function onDocClick(e) {
      sendToAndroid('click', {});
    }

    // ── Swipe Gestures ─────────────────────────────────────────────────────────
    // Uses native addEventListener with passive:false on touchmove so we can
    // call e.preventDefault() to block vertical scroll during horizontal swipe.
    function setupSwipe(doc) {
      try {
        // Remove old listeners (avoid duplicates on re-render)
        doc.removeEventListener('touchstart', onTouchStart, true);
        doc.removeEventListener('touchmove',  onTouchMove,  { passive: false, capture: true });
        doc.removeEventListener('touchend',   onTouchEnd,   true);

        doc.addEventListener('touchstart', onTouchStart, { passive: true, capture: true });
        doc.addEventListener('touchmove',  onTouchMove,  { passive: false, capture: true });
        doc.addEventListener('touchend',   onTouchEnd,   { passive: true, capture: true });
      } catch(e) {}
    }

    let _startX = 0, _startY = 0, _startTime = 0, _isHoriz = null;

    function onTouchStart(e) {
      _startX    = e.changedTouches[0].clientX;
      _startY    = e.changedTouches[0].clientY;
      _startTime = Date.now();
      _isHoriz   = null;
    }

    function onTouchMove(e) {
      if (_isHoriz === null) {
        const dx = Math.abs(e.changedTouches[0].clientX - _startX);
        const dy = Math.abs(e.changedTouches[0].clientY - _startY);
        if (dx > 8 || dy > 8) {
          _isHoriz = dx > dy * 1.2;
        }
      }
      if (_isHoriz === true) {
        e.preventDefault(); // block vertical scroll while swiping horizontally
      }
    }

    function onTouchEnd(e) {
      if (navBusy) return;
      const dx = e.changedTouches[0].clientX - _startX;
      const dy = e.changedTouches[0].clientY - _startY;
      const dt = Date.now() - _startTime;

      if (_isHoriz === true && Math.abs(dx) > 40 && dt < 500) {
        if (dx > 0) doPrev();  // swipe right → previous page
        else        doNext();  // swipe left  → next page
      }
      _isHoriz = null;
    }
  </script>
</body>

</html>
