<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CsReader EPUB Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #faf8f5;
      -webkit-user-select: none;
      user-select: none;
    }

    #viewer-container {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Scroll mode: allow vertical scroll inside the iframe */
    #viewer-container.scroll-mode {
      overflow-y: auto;
    }

    #viewer {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      opacity: 1;
      transform: translateX(0);
      will-change: transform, opacity;
    }

    /* Force iframe to fill the viewer div */
    #viewer iframe {
      border: none !important;
      width: 100% !important;
      height: 100% !important;
      display: block !important;
    }

    /* Scroll mode: iframe can be taller than screen */
    #viewer-container.scroll-mode #viewer {
      position: relative;
      height: auto;
      min-height: 100vh;
    }
    #viewer-container.scroll-mode #viewer iframe {
      height: auto !important;
      min-height: 100vh !important;
    }

    #error-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.88);
      color: #fff;
      z-index: 9999;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 32px;
      text-align: center;
    }
    #error-overlay.show { display: flex; }
    #error-title { font-size: 18px; font-weight: bold; margin-bottom: 12px; }
    #error-detail { font-size: 13px; opacity: 0.75; line-height: 1.6; word-break: break-all; }

    .epubjs-hl         { fill-opacity: 0.3; mix-blend-mode: multiply; cursor: pointer; }
    .epubjs-hl-yellow  { fill: #fef08a; }
    .epubjs-hl-green   { fill: #bbf7d0; }
    .epubjs-hl-pink    { fill: #fbcfe8; }
    .epubjs-hl-blue    { fill: #bfdbfe; }
    .epubjs-hl-underline { fill: transparent; text-decoration: underline dashed #ef4444; }
  </style>
  <script src="epub.min.js"></script>
</head>

<body>
  <div id="viewer-container">
    <div id="viewer"></div>
  </div>
  <div id="error-overlay">
    <div id="error-title">⚠️ Kitap Açılamadı</div>
    <div id="error-detail"></div>
  </div>

  <script>
    // ── Global JS error catcher ────────────────────────────────────────────────
    window.addEventListener('error', function(e) {
      sendToAndroid('error', { message: 'JS hatası: ' + e.message });
    });

    // ── State ──────────────────────────────────────────────────────────────────
    var book = null;
    var rendition = null;
    var currentCfi = '';
    var currentTheme = 'light';
    var currentTransition = 'slide';
    var navBusy = false;
    var navBusyTimer = null;
    var highlights = {};
    var lastBookParams = null;   // stored so we can reload on flow change

    var container = document.getElementById('viewer-container');
    var viewer    = document.getElementById('viewer');

    // ── Android bridge ────────────────────────────────────────────────────────
    function sendToAndroid(type, payload) {
      try {
        var msg = JSON.stringify(Object.assign({ type: type }, payload));
        if (typeof AndroidBridge !== 'undefined') AndroidBridge.postMessage(msg);
      } catch(e) {}
    }

    function showError(title, detail) {
      document.getElementById('error-overlay').classList.add('show');
      document.getElementById('error-title').textContent  = '⚠️ ' + title;
      document.getElementById('error-detail').textContent = detail || '';
      sendToAndroid('error', { message: title + ' ' + (detail || '') });
    }

    // ── Commands from Android ─────────────────────────────────────────────────
    function handleCommand(json) {
      var msg;
      try { msg = JSON.parse(json); } catch(e) { return; }

      switch (msg.action) {
        case 'load':
          loadBook(msg.bookPath, msg.initialCfi, msg.theme,
                   msg.fontSize, msg.pageTransition, msg.highlights || []);
          break;
        case 'next':
          doNext();
          break;
        case 'prev':
          doPrev();
          break;
        case 'goToCfi':
          if (rendition) rendition.display(msg.cfi).catch(function(){});
          break;
        case 'setTheme':
          applyTheme(msg.theme);
          break;
        case 'setFontSize':
          if (rendition) rendition.themes.fontSize(msg.fontSize + 'px');
          break;
        case 'setTransition':
          var wasScroll = currentTransition === 'scroll';
          var isScroll  = msg.pageTransition === 'scroll';
          currentTransition = msg.pageTransition || 'slide';
          // If scroll mode changed we need to reload the book with different flow
          if (wasScroll !== isScroll && lastBookParams) {
            var p = lastBookParams;
            loadBook(p.bookPath, currentCfi || p.initialCfi,
                     p.theme, p.fontSize, currentTransition, p.savedHighlights);
          }
          break;
        case 'addHighlight':
          addHighlight(msg.cfiRange, msg.color);
          break;
        case 'removeHighlight':
          removeHighlight(msg.cfiRange);
          break;
      }
    }

    // PostMessage bridge (React-Native style fallback)
    window.addEventListener('message', function(e) {
      try {
        var d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
        handleCommand(JSON.stringify(d));
      } catch(ex) {}
    });

    // ── Nav lock ───────────────────────────────────────────────────────────────
    function lockNav(ms) {
      navBusy = true;
      clearTimeout(navBusyTimer);
      navBusyTimer = setTimeout(function() { navBusy = false; }, ms);
    }
    function unlockNav() {
      navBusy = false;
      clearTimeout(navBusyTimer);
    }

    // ── Animations ─────────────────────────────────────────────────────────────
    function resetViewer() {
      viewer.style.transition  = 'none';
      viewer.style.transform   = 'translateX(0) perspective(1200px) rotateY(0deg)';
      viewer.style.opacity     = '1';
      viewer.style.transformOrigin = '50% 50%';
    }

    // SLIDE: full-screen horizontal slide
    function slideOut(direction) {
      return new Promise(function(resolve) {
        viewer.style.transition = 'transform 0.28s ease-in-out, opacity 0.28s ease-in-out';
        viewer.style.transform  = direction === 'next' ? 'translateX(-100%)' : 'translateX(100%)';
        viewer.style.opacity    = '0.3';
        setTimeout(resolve, 290);
      });
    }
    function slideIn(direction) {
      viewer.style.transition  = 'none';
      viewer.style.transform   = direction === 'next' ? 'translateX(100%)' : 'translateX(-100%)';
      viewer.style.opacity     = '0';
      void viewer.offsetWidth; // force reflow
      viewer.style.transition  = 'transform 0.28s ease-out, opacity 0.28s ease-out';
      viewer.style.transform   = 'translateX(0)';
      viewer.style.opacity     = '1';
    }

    // FADE
    function fadeOut() {
      return new Promise(function(resolve) {
        viewer.style.transition = 'opacity 0.22s ease';
        viewer.style.opacity    = '0';
        setTimeout(resolve, 230);
      });
    }
    function fadeIn() {
      viewer.style.transition = 'opacity 0.22s ease';
      viewer.style.opacity    = '1';
    }

    // PAGE TURN: 3-D flip around the spine
    function pageOut(direction) {
      return new Promise(function(resolve) {
        viewer.style.transformOrigin = direction === 'next' ? 'left center' : 'right center';
        viewer.style.transition      = 'transform 0.35s ease-in, opacity 0.25s ease-in';
        viewer.style.transform       = direction === 'next'
          ? 'perspective(1200px) rotateY(-90deg) scale(0.95)'
          : 'perspective(1200px) rotateY(90deg) scale(0.95)';
        viewer.style.opacity = '0.1';
        setTimeout(resolve, 360);
      });
    }
    function pageIn(direction) {
      viewer.style.transition      = 'none';
      viewer.style.transformOrigin = direction === 'next' ? 'right center' : 'left center';
      viewer.style.transform       = direction === 'next'
        ? 'perspective(1200px) rotateY(90deg) scale(0.95)'
        : 'perspective(1200px) rotateY(-90deg) scale(0.95)';
      viewer.style.opacity = '0.1';
      void viewer.offsetWidth;
      viewer.style.transition = 'transform 0.35s ease-out, opacity 0.25s ease-out';
      viewer.style.transform  = 'perspective(1200px) rotateY(0deg) scale(1)';
      viewer.style.opacity    = '1';
    }

    // ── Navigation ─────────────────────────────────────────────────────────────
    function doNext() {
      if (navBusy || !rendition || currentTransition === 'scroll') return;
      lockNav(900);

      if (currentTransition === 'slide') {
        slideOut('next').then(function() {
          rendition.next().then(function() { slideIn('next'); }).catch(unlockNav);
        });
      } else if (currentTransition === 'fade') {
        fadeOut().then(function() {
          rendition.next().then(function() { fadeIn(); }).catch(unlockNav);
        });
      } else if (currentTransition === 'page') {
        pageOut('next').then(function() {
          rendition.next().then(function() { pageIn('next'); }).catch(unlockNav);
        });
      } else {
        rendition.next().catch(function(){});
        unlockNav();
      }
    }

    function doPrev() {
      if (navBusy || !rendition || currentTransition === 'scroll') return;
      lockNav(900);

      if (currentTransition === 'slide') {
        slideOut('prev').then(function() {
          rendition.prev().then(function() { slideIn('prev'); }).catch(unlockNav);
        });
      } else if (currentTransition === 'fade') {
        fadeOut().then(function() {
          rendition.prev().then(function() { fadeIn(); }).catch(unlockNav);
        });
      } else if (currentTransition === 'page') {
        pageOut('prev').then(function() {
          rendition.prev().then(function() { pageIn('prev'); }).catch(unlockNav);
        });
      } else {
        rendition.prev().catch(function(){});
        unlockNav();
      }
    }

    // ── Load Book ──────────────────────────────────────────────────────────────
    function loadBook(bookPath, initialCfi, theme, fontSize, pageTransition, savedHighlights) {
      currentTransition = pageTransition || 'slide';
      lastBookParams    = {
        bookPath: bookPath, initialCfi: initialCfi, theme: theme,
        fontSize: fontSize, pageTransition: pageTransition, savedHighlights: savedHighlights
      };

      // Reset visuals
      resetViewer();
      document.getElementById('error-overlay').classList.remove('show');

      // Scroll mode: modify container
      var isScroll = currentTransition === 'scroll';
      if (isScroll) {
        container.classList.add('scroll-mode');
      } else {
        container.classList.remove('scroll-mode');
      }

      // Destroy previous book
      if (book) {
        try { book.destroy(); } catch(e) {}
        book       = null;
        rendition  = null;
        viewer.innerHTML = '';
      }

      // Create book — epub.js fetches the EPUB via HTTP from LocalWebServer
      book = ePub(bookPath);

      // Error handling
      book.opened.catch(function(err) {
        showError('Kitap açılamadı', err ? err.message : bookPath);
      });

      // ToC
      book.loaded.navigation.then(function(toc) {
        var chapters = toc.toc ? toc.toc.map(function(ch) {
          return { label: (ch.label || '').trim(), href: ch.href };
        }) : [];
        sendToAndroid('toc', { chapters: chapters });
      }).catch(function(){});

      // Metadata
      book.loaded.metadata.then(function(meta) {
        sendToAndroid('metadata', { title: meta.title, creator: meta.creator });
      }).catch(function(){});

      // ──────────────────────────────────────────────────────────────────────
      // KEY FIX: use explicit pixel dimensions, NOT percentage strings.
      // epub.js parses width/height as numbers when they are numbers, and as
      // CSS when they are strings. Percentage strings cause sizing problems in
      // Android WebView — use exact pixel values instead.
      // ──────────────────────────────────────────────────────────────────────
      var W = window.innerWidth;
      var H = window.innerHeight;

      rendition = book.renderTo('viewer', {
        width:    W,
        height:   isScroll ? 9999 : H,
        spread:   'none',
        flow:     isScroll ? 'scrolled-continuous' : 'paginated',
        manager:  'default'
      });

      // Apply appearance
      applyTheme(theme || 'light');
      rendition.themes.fontSize((fontSize || 16) + 'px');

      // Re-apply highlights whenever a section renders
      rendition.on('rendered', function(section, view) {
        savedHighlights.forEach(function(hl) {
          addHighlight(hl.cfiRange, hl.color);
        });
      });

      // Progress tracking
      rendition.on('relocated', function(location) {
        if (!isScroll) resetViewer();
        unlockNav();
        currentCfi = location.start.cfi;
        var progress = 0;
        try { progress = book.locations.percentageFromCfi(currentCfi) || 0; } catch(e) {}
        sendToAndroid('relocated', {
          cfi:      currentCfi,
          progress: progress,
          atStart:  location.atStart,
          atEnd:    location.atEnd
        });
      });

      // Text selection
      rendition.on('selected', function(cfiRange, contents) {
        try {
          var text = contents.window.getSelection().toString().trim();
          if (text.length > 0) sendToAndroid('selected', { cfiRange: cfiRange, text: text });
        } catch(e) {}
      });

      // Display
      var displayTarget = (initialCfi && initialCfi !== '') ? initialCfi : undefined;
      rendition.display(displayTarget).catch(function() {
        rendition.display().catch(function(err) {
          showError('Sayfa görüntülenemedi', err ? err.message : '');
        });
      });

      // Background: generate locations for progress %
      book.ready.then(function() {
        book.locations.generate(1024).then(function() {
          if (currentCfi) {
            try {
              var p = book.locations.percentageFromCfi(currentCfi) || 0;
              sendToAndroid('progressReady', { progress: p });
            } catch(e) {}
          }
        }).catch(function(){});
      }).catch(function(){});
    }

    // ── Theme ──────────────────────────────────────────────────────────────────
    function applyTheme(theme) {
      currentTheme = theme;
      var themes = {
        light:  { bg: '#faf8f5', color: '#1c1917', link: '#2563eb' },
        dark:   { bg: '#0f0f0f', color: '#e5e5e5', link: '#60a5fa' },
        sepia:  { bg: '#f4ecd8', color: '#5c4033', link: '#92400e' },
        forest: { bg: '#eef1eb', color: '#2d3a24', link: '#166534' }
      };
      var t = themes[theme] || themes.light;
      document.body.style.backgroundColor = t.bg;
      container.style.backgroundColor     = t.bg;

      if (rendition) {
        rendition.themes.default({
          body: {
            'background-color': t.bg + ' !important',
            'color':            t.color + ' !important',
            'line-height':      '1.75 !important',
            'font-family':      'system-ui,-apple-system,sans-serif !important'
          },
          p:    { 'color': t.color + ' !important' },
          span: { 'color': t.color + ' !important' },
          a:    { 'color': t.link + ' !important' }
        });
      }
    }

    // ── Highlights ─────────────────────────────────────────────────────────────
    function addHighlight(cfiRange, color) {
      if (!rendition || !cfiRange) return;
      var classMap = {
        yellow: 'epubjs-hl-yellow', green: 'epubjs-hl-green',
        pink:   'epubjs-hl-pink',   blue:  'epubjs-hl-blue',
        underline: 'epubjs-hl-underline'
      };
      var cls = classMap[color] || 'epubjs-hl-yellow';
      try {
        rendition.annotations.add('highlight', cfiRange, {}, function() {
          sendToAndroid('highlightClicked', { cfiRange: cfiRange });
        }, cls);
        highlights[cfiRange] = color;
      } catch(e) {}
    }

    function removeHighlight(cfiRange) {
      if (!rendition || !cfiRange) return;
      try {
        rendition.annotations.remove(cfiRange, 'highlight');
        delete highlights[cfiRange];
      } catch(e) {}
    }

    // ── Gesture handling on OUTER CONTAINER ──────────────────────────────────
    // By handling touch on the outer container (main document), we completely
    // avoid the iframe cross-origin / passive-event issues in Android WebView.
    var _sx = 0, _sy = 0, _st = 0, _horiz = null;

    container.addEventListener('touchstart', function(e) {
      _sx    = e.changedTouches[0].clientX;
      _sy    = e.changedTouches[0].clientY;
      _st    = Date.now();
      _horiz = null;
    }, { passive: true });

    container.addEventListener('touchmove', function(e) {
      if (_horiz === null) {
        var dx = Math.abs(e.changedTouches[0].clientX - _sx);
        var dy = Math.abs(e.changedTouches[0].clientY - _sy);
        if (dx > 8 || dy > 8) _horiz = dx > dy * 1.3;
      }
      // Only block default scroll for confirmed horizontal swipes in non-scroll mode
      if (_horiz === true && currentTransition !== 'scroll') {
        e.preventDefault();
      }
    }, { passive: false });

    container.addEventListener('touchend', function(e) {
      if (currentTransition === 'scroll') { _horiz = null; return; }
      var dx = e.changedTouches[0].clientX - _sx;
      var dy = e.changedTouches[0].clientY - _sy;
      var dt = Date.now() - _st;
      if (_horiz === true && Math.abs(dx) > 40 && dt < 500) {
        if (dx > 0) doPrev();
        else        doNext();
      }
      _horiz = null;
    }, { passive: true });

    // Click on outer container → tell Android to toggle controls
    container.addEventListener('click', function(e) {
      sendToAndroid('click', {});
    });
  </script>
</body>

</html>
